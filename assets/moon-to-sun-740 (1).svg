<svg viewBox="0 0 740 240" width="740" height="240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Transição da lua para o sol" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      .a{animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.45,0,.25,1);animation-fill-mode:both}
      .shadow{animation-name:shadow}
      @keyframes shadow{0%,8%{transform:translateX(-22px)}32%,88%{transform:translateX(120px)}100%{transform:translateX(-22px)}}
      .orb{animation-name:orbfill}
      @keyframes orbfill{0%,26%{fill:#c4b0f0}46%,88%{fill:#ffc857}100%{fill:#c4b0f0}}
      .crater{animation-name:crater}
      @keyframes crater{0%,26%{opacity:1}40%,88%{opacity:0}100%{opacity:1}}
      .mh{animation-name:mh}
      @keyframes mh{0%,26%{opacity:1}46%,88%{opacity:0}100%{opacity:1}}
      .sh{animation-name:sh;transform-origin:370px 112px}
      @keyframes sh{0%,38%{opacity:0}56%,88%{opacity:1}100%{opacity:0}}
      .rays{animation-name:rays;transform-origin:370px 112px}
      @keyframes rays{0%,38%{opacity:0;transform:scale(.6)}56%,88%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
      .spin{transform-origin:370px 112px;animation:spin 40s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .pulse{transform-origin:370px 112px;animation:pulse 3.5s ease-in-out infinite alternate}
      @keyframes pulse{from{transform:scale(.94)}to{transform:scale(1.06)}}
      .stars{animation-name:stars}
      @keyframes stars{0%,24%{opacity:1}44%,88%{opacity:0}100%{opacity:1}}
      .tw{animation:tw 3s ease-in-out infinite alternate}
      @keyframes tw{from{opacity:.25}to{opacity:1}}
      .lua{animation-name:lua}
      @keyframes lua{0%,20%{opacity:1}46%,88%{opacity:.3}100%{opacity:1}}
      .sol{animation-name:sol}
      @keyframes sol{0%,20%{opacity:.3}46%,88%{opacity:1}100%{opacity:.3}}
      .prog{animation-name:prog}
      @keyframes prog{0%,8%{width:0}52%,88%{width:548px}100%{width:0}}
      .dot{animation-name:dot}
      @keyframes dot{0%,8%{transform:translateX(-548px);fill:#c4b0f0}52%,88%{transform:translateX(0);fill:#ffc857}100%{transform:translateX(-548px);fill:#c4b0f0}}
      .fi{animation:fade-in .5s ease both}
      @keyframes fade-in{from{opacity:0}to{opacity:1}}
    </style>
    <radialGradient id="hMoon"><stop offset="0%" stop-color="#7F77DD" stop-opacity=".45"/><stop offset="100%" stop-color="#7F77DD" stop-opacity="0"/></radialGradient>
    <radialGradient id="hSun"><stop offset="0%" stop-color="#ffc857" stop-opacity=".5"/><stop offset="60%" stop-color="#ff9f43" stop-opacity=".12"/><stop offset="100%" stop-color="#ff9f43" stop-opacity="0"/></radialGradient>
    <linearGradient id="gTrack" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#534AB7"/><stop offset="100%" stop-color="#ffc857"/></linearGradient>
    <clipPath id="orbclip"><circle cx="370" cy="112" r="40"/></clipPath>
  </defs>

  <rect width="740" height="240" rx="10" fill="#12101c"/>
  <rect x=".25" y=".25" width="739.5" height="239.5" rx="10" fill="none" stroke="#2e2a45" stroke-width=".5"/>

  <g class="a stars" style="opacity:0"><circle cx="60" cy="70" r="1.3" fill="#d6c9ff" class="tw" style="animation-delay:0s"/><circle cx="110" cy="110" r="1" fill="#d6c9ff" class="tw" style="animation-delay:1.2s"/><circle cx="160" cy="64" r="1.5" fill="#d6c9ff" class="tw" style="animation-delay:0.6s"/><circle cx="210" cy="150" r="1" fill="#d6c9ff" class="tw" style="animation-delay:2.1s"/><circle cx="250" cy="84" r="1.2" fill="#d6c9ff" class="tw" style="animation-delay:1.7s"/><circle cx="120" cy="170" r="1.2" fill="#d6c9ff" class="tw" style="animation-delay:0.3s"/><circle cx="520" cy="74" r="1.2" fill="#d6c9ff" class="tw" style="animation-delay:0.9s"/><circle cx="570" cy="120" r="1.5" fill="#d6c9ff" class="tw" style="animation-delay:2.4s"/><circle cx="620" cy="66" r="1" fill="#d6c9ff" class="tw" style="animation-delay:1.4s"/><circle cx="670" cy="108" r="1.3" fill="#d6c9ff" class="tw" style="animation-delay:0.2s"/><circle cx="600" cy="164" r="1" fill="#d6c9ff" class="tw" style="animation-delay:1.9s"/><circle cx="540" cy="170" r="1.2" fill="#d6c9ff" class="tw" style="animation-delay:0.7s"/><circle cx="300" cy="58" r="1" fill="#d6c9ff" class="tw" style="animation-delay:2.6s"/><circle cx="450" cy="56" r="1.2" fill="#d6c9ff" class="tw" style="animation-delay:1.1s"/><circle cx="690" cy="160" r="1" fill="#d6c9ff" class="tw" style="animation-delay:0.5s"/><circle cx="80" cy="140" r="1" fill="#d6c9ff" class="tw" style="animation-delay:2.2s"/></g>

  <circle class="a mh" cx="370" cy="112" r="88" fill="url(#hMoon)" style="opacity:0"/>
  <g class="a sh" style="opacity:1"><g class="pulse"><circle cx="370" cy="112" r="104" fill="url(#hSun)"/></g></g>

  <g class="a rays" style="opacity:1"><g class="spin"><line x1="424.0" y1="112.0" x2="444.0" y2="112.0" stroke="#ff9f43" stroke-width="2.4" stroke-linecap="round"/><line x1="416.8" y1="139.0" x2="427.2" y2="145.0" stroke="#ffc857" stroke-width="2.4" stroke-linecap="round"/><line x1="397.0" y1="158.8" x2="407.0" y2="176.1" stroke="#ff9f43" stroke-width="2.4" stroke-linecap="round"/><line x1="370.0" y1="166.0" x2="370.0" y2="178.0" stroke="#ffc857" stroke-width="2.4" stroke-linecap="round"/><line x1="343.0" y1="158.8" x2="333.0" y2="176.1" stroke="#ff9f43" stroke-width="2.4" stroke-linecap="round"/><line x1="323.2" y1="139.0" x2="312.8" y2="145.0" stroke="#ffc857" stroke-width="2.4" stroke-linecap="round"/><line x1="316.0" y1="112.0" x2="296.0" y2="112.0" stroke="#ff9f43" stroke-width="2.4" stroke-linecap="round"/><line x1="323.2" y1="85.0" x2="312.8" y2="79.0" stroke="#ffc857" stroke-width="2.4" stroke-linecap="round"/><line x1="343.0" y1="65.2" x2="333.0" y2="47.9" stroke="#ff9f43" stroke-width="2.4" stroke-linecap="round"/><line x1="370.0" y1="58.0" x2="370.0" y2="46.0" stroke="#ffc857" stroke-width="2.4" stroke-linecap="round"/><line x1="397.0" y1="65.2" x2="407.0" y2="47.9" stroke="#ff9f43" stroke-width="2.4" stroke-linecap="round"/><line x1="416.8" y1="85.0" x2="427.2" y2="79.0" stroke="#ffc857" stroke-width="2.4" stroke-linecap="round"/></g></g>

  <g>
    <circle class="a orb" cx="370" cy="112" r="40" style="fill:#ffc857"/>
    <g class="a crater" style="opacity:0" fill="#9a86dc">
      <circle cx="392" cy="103" r="5.5" opacity=".55"/>
      <circle cx="396" cy="121" r="3.5" opacity=".5"/>
      <circle cx="386" cy="134" r="2.6" opacity=".45"/>
      <circle cx="358" cy="102" r="7" opacity=".5"/>
      <circle cx="364" cy="128" r="3.4" opacity=".45"/>
    </g>
    <g clip-path="url(#orbclip)"><circle class="a shadow" cx="370" cy="112" r="41" fill="#15122a" transform="translate(120 0)"/></g>
  </g>

  <text x="22" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#c4b0f0" class="a lua">[LUA]</text>
  <text x="718" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#ffc857" text-anchor="end" class="a sol" style="opacity:1">[SOL]</text>
  <rect x="96" y="209" width="548" height="6" rx="3" fill="#1e1b2e"/>
  <rect class="a prog" x="96" y="209" width="548" height="6" rx="3" fill="url(#gTrack)"/>
  <circle class="a dot" cx="644" cy="212" r="4.5" style="fill:#ffc857"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
